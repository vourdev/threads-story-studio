services:
  - type: web
    name: threads-story-studio-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run db:migrate -w @tss/api
    startCommand: npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: threads-story-studio-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: OMNIROUTE_API_KEY
        sync: false
      - key: OMNIROUTE_BASE_URL
        value: https://fingers-emotional-spider-film.trycloudflare.com/v1
      - key: OMNIROUTE_MODEL
        value: vour-combos
      - key: OMNIROUTE_MODEL_FAST
        value: vour-combos
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash

databases:
  - name: threads-story-studio-db
    plan: free
    region: singapore
    databaseName: threads_story_studio
    user: tss
